; Unitree handheld RC <-> LilyGO T3-S3 (SX1280, 2.4 GHz LoRa) link analyzer
[env:t3s3]
platform         = espressif32
board            = esp32-s3-devkitc-1
framework        = arduino
monitor_speed    = 115200
upload_speed     = 921600
; This T3-S3 is a 4 MB-flash part; override the devkit default (8 MB) header
board_upload.flash_size = 4MB
board_build.flash_size  = 4MB
board_build.partitions  = default.csv
; ESP32-S3 native USB (the /dev/ttyACM0 303a:1001 port) as Serial
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    jgromes/RadioLib@^7.1.2
    olikraus/U8g2@^2.35.30
